name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'builds/**'
      - 'windows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: version
        shell: bash
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: //' | xargs)
          VERSION="${RAW%%+*}"
          VCODE="${RAW##*+}"
          echo "vname=$VERSION" >> $GITHUB_OUTPUT
          echo "vcode=$VCODE" >> $GITHUB_OUTPUT

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Copy APKs to builds directory
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.vname }}"
          mkdir -p builds
          for apk in build/app/outputs/flutter-apk/*-arm*.apk; do
            [ -f "$apk" ] || continue
            ABI=$(basename "$apk" | sed 's/app-//' | sed 's/-release.apk//')
            cp "$apk" "builds/flow-v${VERSION}-${ABI}.apk"
          done
          ls -lh builds/

      - name: Generate update manifest and changelog
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.vname }}"
          VCODE="${{ steps.version.outputs.vcode }}"
          mkdir -p builds/whatsnew

          # Auto-generate the "What's new" notes from feat:/fix: commits since the
          # previous release — but never clobber a hand-written one for this version.
          CHANGELOG="builds/whatsnew/${VERSION}.md"
          if [ ! -f "$CHANGELOG" ]; then
            PREV=$(git log --format='%H' --grep='chore: add Android builds' -n 1 || true)
            RANGE="HEAD"
            [ -n "$PREV" ] && RANGE="${PREV}..HEAD"
            {
              echo "## What's new in ${VERSION}"
              echo
              NOTES=$(git log $RANGE --pretty='%s' \
                | grep -E '^(feat|fix|perf)(\(.*\))?:' \
                | sed -E 's/^(feat|fix|perf)(\(.*\))?: */- /' || true)
              if [ -n "$NOTES" ]; then
                echo "$NOTES"
              else
                echo "- Improvements and bug fixes."
              fi
            } > "$CHANGELOG"
          fi

          # Build the manifest, including only ABIs we actually produced.
          {
            echo '{'
            echo "  \"versionName\": \"${VERSION}\","
            echo "  \"versionCode\": ${VCODE},"
            echo "  \"changelogPath\": \"builds/whatsnew/${VERSION}.md\","
            echo '  "apks": {'
            first=1
            for ABI in arm64-v8a armeabi-v7a; do
              APK="builds/flow-v${VERSION}-${ABI}.apk"
              [ -f "$APK" ] || continue
              [ $first -eq 0 ] && echo ','
              printf '    "%s": "%s"' "$ABI" "$APK"
              first=0
            done
            echo
            echo '  }'
            echo '}'
          } > builds/latest.json
          cat builds/latest.json

      - name: Commit and push builds to repository
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add builds/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: add Android builds v${{ steps.version.outputs.vname }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
