name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'builds/**'
      - 'windows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | xargs)
          echo "vname=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Copy APKs to builds directory
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.vname }}"
          mkdir -p builds
          for apk in build/app/outputs/flutter-apk/*-arm*.apk; do
            [ -f "$apk" ] || continue
            ABI=$(basename "$apk" | sed 's/app-//' | sed 's/-release.apk//')
            cp "$apk" "builds/flow-v${VERSION}-${ABI}.apk"
          done
          ls -lh builds/

      - name: Commit and push builds to repository
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add builds/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: add Android builds v${{ steps.version.outputs.vname }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
